name: Checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:team:e2e
      - run: npm run verify:blackbox
      - run: npm run verify:game-agent -- --reuse-script
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm.cmd ci
      - run: npm.cmd run build:desktop
      - run: rustup component add rustfmt clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cargo fmt --all -- --check
      - run: cargo test -p agent-runtime -p execution-runtime -p process-runtime --locked
      - run: cargo clippy -p agent-runtime -p execution-runtime -p process-runtime --all-targets --locked -- -D warnings
      - run: cargo check -p verification-desktop --locked
      - run: npm.cmd run verify:workflow
