name: Checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm.cmd ci
      - run: npm.cmd run build
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo test -p agent-runtime --locked
      - run: cargo clippy -p agent-runtime --locked -- -D warnings
      - run: cargo check -p verification-desktop --locked
