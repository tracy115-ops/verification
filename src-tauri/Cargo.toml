[package]
name = "verification-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "verification_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-runtime = { path = "../crates/agent-runtime" }
execution-runtime = { path = "../crates/execution-runtime" }
process-runtime = { path = "../crates/process-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"
if-addrs = "=0.15.0"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync", "fs", "process", "net", "time", "io-util"] }
