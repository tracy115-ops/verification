[package]
name = "verification-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "verification_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-runtime = { path = "../crates/agent-runtime" }
execution-runtime = { path = "../crates/execution-runtime" }
process-runtime = { path = "../crates/process-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"
if-addrs = "=0.15.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "system-proxy", "socks"] }
semver = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync", "fs", "process", "net", "time", "io-util"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-registry = "0.6"
